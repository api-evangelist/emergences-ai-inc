name: EMERGENCES AI, INC.
description: >-
  EMERGENCES AI, INC. (Emergences Labs) builds human competency models,
  assessment, and training solutions for the AI era, focused on defining the
  transformative skills whose value compounds rather than erodes as AI advances.
  Its products include NeoWork, real-world task assessments for recruiting and
  identifying top performers in AI-native roles and for reskilling; NeoHuman,
  deliberate-practice training that teaches professionals and students effective
  human-AI collaboration through real enterprise work; and an expert-curated
  Data offering of annotated professional workflow trajectories for agent
  reinforcement learning and domain-specific benchmarks. The company was
  surfaced as a portfolio company of 500 Global and added to the API Evangelist
  network. It publishes a public website with research, blog, careers, and legal
  pages, but does not currently expose a public API, developer portal, or SDKs.
